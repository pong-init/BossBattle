[project]
name = "bossbattle"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain-arcade>=1.4",
    "langchain-google-genai",
    "langgraph",
    "arcade-ai[evals]",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "pydantic>=2.0",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
