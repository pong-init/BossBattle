[project]
name = "bossbattle"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain-google-genai",
    "langchain-mcp-adapters",
    "langgraph",
    "pydantic",
    "python-dotenv",
    "arcadepy",
    "openai",
    "arcade-core",
    "arcade-evals",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-langchain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
